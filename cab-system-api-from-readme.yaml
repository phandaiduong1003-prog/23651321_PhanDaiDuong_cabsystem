openapi: 3.0.0

info:
  title: CAB System API
  version: 1.0.0
  description: |
    Tài liệu REST API cho hệ thống CAB, được xây dựng từ Business Requirements,
    Functional Requirements, Use Case, quy trình nghiệp vụ và Business Rules
    trong README của dự án.

    Nguyên tắc thiết kế:
    - Chỉ mô tả các nghiệp vụ đã xuất hiện trong README.
    - Tên endpoint là đề xuất kỹ thuật REST để ánh xạ các chức năng trong README.
    - README chưa quy định cơ chế token/JWT cụ thể nên tài liệu này không tự khai báo BearerAuth.
    - Các trường dữ liệu mà README chưa xác định chi tiết được để ở dạng object mở và có ghi chú.
    - UC07 Thông báo chủ yếu là xử lý theo sự kiện của hệ thống nên không tự tạo API công khai riêng.
    - UC11 Bảo mật và phân quyền là yêu cầu xuyên suốt; README chưa quy định API quản trị quyền riêng biệt.

servers:
  - url: /api/v1
    description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.

tags:
  - name: Account
    description: UC01 - Quản lý tài khoản và hồ sơ
  - name: Booking
    description: UC02 - Đặt xe
  - name: Dispatch
    description: UC03 - Tìm và phân công tài xế
  - name: Trip
    description: UC04, UC05 - Quản lý và theo dõi chuyến đi
  - name: Payment
    description: UC06 - Tính cước và thanh toán
  - name: HistoryRating
    description: UC08 - Lịch sử và đánh giá chuyến
  - name: Operation
    description: UC09 - Quản lý vận hành
  - name: Report
    description: UC10 - Quản lý giao dịch và báo cáo

paths:

  /auth/register:
    post:
      tags:
        - Account
      summary: Đăng ký tài khoản khách hàng
      description: |
        Ánh xạ FR-01 và UC01.
        README chỉ yêu cầu khách hàng có thể tạo tài khoản mới,
        nhưng chưa quy định cụ thể các trường đăng ký.
      operationId: registerCustomer
      requestBody:
        required: true
        description: Thông tin đăng ký theo chính sách tài khoản của doanh nghiệp.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResult'
        '400':
          description: Dữ liệu đăng ký thiếu hoặc không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Account
      summary: Đăng nhập hệ thống
      description: |
        Ánh xạ FR-02, FR-54 và UC01/UC11.
        README yêu cầu xác thực người dùng nhưng không quy định JWT,
        session hay loại token cụ thể.
      operationId: login
      requestBody:
        required: true
        description: Thông tin xác thực. Các trường cụ thể chưa được README xác định.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: Thiếu dữ liệu đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thông tin xác thực không chính xác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/profile:
    get:
      tags:
        - Account
      summary: Xem hồ sơ hiện tại
      description: |
        Ánh xạ UC01. Use Case mô tả người dùng mở chức năng hồ sơ
        và hệ thống hiển thị thông tin hiện tại.
      operationId: getMyProfile
      responses:
        '200':
          description: Trả về hồ sơ hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Người dùng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Account
      summary: Cập nhật hồ sơ cá nhân
      description: Ánh xạ FR-03 và UC01.
      operationId: updateMyProfile
      requestBody:
        required: true
        description: Dữ liệu hồ sơ cần thay đổi. README chưa quy định danh sách trường cụ thể.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Dữ liệu hồ sơ không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Người dùng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/me/profile:
    put:
      tags:
        - Account
      summary: Cập nhật hồ sơ và dữ liệu phương tiện của tài xế
      description: |
        Ánh xạ FR-05 và UC01.
        README cho phép tài xế bổ sung/thay đổi hồ sơ và dữ liệu phương tiện,
        nhưng chưa quy định chi tiết các trường.
      operationId: updateDriverProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          description: Dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền của tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/me/status:
    put:
      tags:
        - Account
      summary: Cập nhật trạng thái hoạt động của tài xế
      description: |
        Ánh xạ FR-06 và BR-R02.
        Tài xế có thể chuyển trạng thái hoạt động; khi đã nhận chuyến,
        hệ thống có thể tự chuyển tài xế sang trạng thái Busy.
      operationId: updateDriverWorkingStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Trạng thái được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverStatus'
        '400':
          description: Trạng thái không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền của tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings:
    post:
      tags:
        - Booking
      summary: Tạo yêu cầu đặt xe
      description: |
        Ánh xạ FR-07 đến FR-11 và UC02.
        Khách hàng cung cấp điểm đón, điểm đến và loại xe,
        sau đó xác nhận để hệ thống tạo yêu cầu đặt xe.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Yêu cầu đặt xe được ghi nhận và chuyển sang bước tìm tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Điểm đón, điểm đến, loại xe hoặc thông tin bắt buộc không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Khách hàng chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Không thể ghi nhận yêu cầu đặt xe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trip-offers/{offerId}/accept:
    post:
      tags:
        - Dispatch
      summary: Tài xế chấp nhận lời mời chuyến
      description: |
        Ánh xạ FR-15, FR-16, FR-19 và UC03.
        Khi tài xế chấp nhận, hệ thống ghi nhận tài xế được phân công cho chuyến.
      operationId: acceptTripOffer
      parameters:
        - name: offerId
          in: path
          required: true
          description: Mã lời mời chuyến do hệ thống tạo.
          schema:
            type: string
      responses:
        '200':
          description: Tài xế được ghi nhận và gán cho chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripAssignment'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tài xế không đủ điều kiện nhận chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy lời mời chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lời mời không còn ở trạng thái có thể chấp nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trip-offers/{offerId}/reject:
    post:
      tags:
        - Dispatch
      summary: Tài xế từ chối lời mời chuyến
      description: |
        Ánh xạ FR-17, UC03 và BR-R05.
        Sau khi tài xế từ chối, hệ thống tiếp tục chuyển yêu cầu
        đến tài xế phù hợp tiếp theo.
      operationId: rejectTripOffer
      parameters:
        - name: offerId
          in: path
          required: true
          description: Mã lời mời chuyến do hệ thống tạo.
          schema:
            type: string
      responses:
        '200':
          description: Ghi nhận từ chối; hệ thống tiếp tục quá trình điều phối.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy lời mời chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lời mời không còn ở trạng thái có thể từ chối.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trips/{tripId}/status:
    put:
      tags:
        - Trip
      summary: Tài xế cập nhật trạng thái chuyến
      description: |
        Ánh xạ FR-21 đến FR-24 và UC04.
        Các giai đoạn được README nêu gồm: tới điểm đón, đã đón khách,
        đang thực hiện chuyến và hoàn tất.
      operationId: updateTripStatus
      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Trạng thái chuyến được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Trạng thái hoặc dữ liệu cập nhật không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tài xế không được phân công cho chuyến này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/me/location:
    put:
      tags:
        - Trip
      summary: Cập nhật vị trí tài xế
      description: |
        Ánh xạ FR-25 và quy trình thực hiện chuyến.
        README yêu cầu ứng dụng tài xế gửi dữ liệu GPS định kỳ trong chuyến.
      operationId: updateDriverLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Vị trí được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Dữ liệu vị trí không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trips/{tripId}/tracking:
    get:
      tags:
        - Trip
      summary: Theo dõi chuyến đi
      description: |
        Ánh xạ FR-26 và UC05.
        Hệ thống trả về trạng thái hiện tại, vị trí tài xế khi có dữ liệu,
        thông tin tài xế và thời gian dự kiến nếu dữ liệu đáp ứng điều kiện.
      operationId: getTripTracking
      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi.
          schema:
            type: string
      responses:
        '200':
          description: Thông tin theo dõi chuyến hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripTracking'
        '401':
          description: Khách hàng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền xem chuyến này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trips/{tripId}/fare:
    get:
      tags:
        - Payment
      summary: Lấy số tiền của chuyến
      description: |
        Ánh xạ FR-27, FR-28, UC06 và BR-R06.
        README quy định hệ thống xác định số tiền phải thanh toán
        dựa trên loại dịch vụ và thông tin của chuyến.
      operationId: getTripFare
      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi.
          schema:
            type: string
      responses:
        '200':
          description: Trả về thông tin cước của chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '401':
          description: Người dùng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền xem chuyến này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trips/{tripId}/payments:
    post:
      tags:
        - Payment
      summary: Ghi nhận hoặc thực hiện thanh toán chuyến
      description: |
        Ánh xạ FR-29 đến FR-32, UC06, BR-R07 và BR-R08.
        Hỗ trợ tiền mặt hoặc thanh toán điện tử.
        CAB không lưu trực tiếp PAN/số thẻ, CVV/CVC, OTP hoặc mật khẩu thanh toán.
      operationId: createTripPayment
      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Kết quả giao dịch được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Phương thức hoặc dữ liệu thanh toán không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Người dùng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Nhà cung cấp thanh toán điện tử không phản hồi hoặc xử lý thất bại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống CAB không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/me/trips:
    get:
      tags:
        - HistoryRating
      summary: Xem lịch sử chuyến
      description: Ánh xạ FR-39 và UC08.
      operationId: getMyTripHistory
      responses:
        '200':
          description: Danh sách các chuyến đã thực hiện.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripHistoryItem'
        '401':
          description: Khách hàng chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
