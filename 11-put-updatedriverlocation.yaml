openapi: 3.0.0
info:
  title: CAB System API - Cập nhật vị trí tài xế
  version: 1.0.0
  description: Tài liệu OpenAPI riêng cho API PUT /drivers/me/location. Nội dung được tách nguyên từ tài liệu CAB System API
    dựa trên README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Trip
  description: UC04, UC05 - Quản lý và theo dõi chuyến đi
paths:
  /drivers/me/location:
    put:
      tags:
      - Trip
      summary: Cập nhật vị trí tài xế
      description: 'Ánh xạ FR-25 và quy trình thực hiện chuyến.

        README yêu cầu ứng dụng tài xế gửi dữ liệu GPS định kỳ trong chuyến.

        '
      operationId: updateDriverLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Vị trí được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Dữ liệu vị trí không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Location:
      type: object
      description: 'Dữ liệu vị trí GPS. latitude/longitude là biểu diễn kỹ thuật

        tối thiểu để mô tả dữ liệu vị trí trong API.

        '
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - latitude
      - longitude
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
