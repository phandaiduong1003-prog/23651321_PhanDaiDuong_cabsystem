components:
  schemas:

    RegisterRequest:
      type: object
      description: |
        Thông tin tạo tài khoản. README chưa quy định tên các trường
        như username/email/số điện thoại nên không tự thêm trường cụ thể.
      additionalProperties: true

    AccountResult:
      type: object
      properties:
        accountId:
          type: string
          description: Mã tài khoản do hệ thống tạo.
        message:
          type: string
      required:
        - accountId

    LoginRequest:
      type: object
      description: |
        Thông tin xác thực. README chưa quy định tên đăng nhập,
        mật khẩu, OTP hay cơ chế xác thực cụ thể.
      additionalProperties: true

    LoginResult:
      type: object
      description: |
        Kết quả xác thực. README chưa quy định loại token/session,
        vì vậy không tự khai báo accessToken hoặc JWT.
      properties:
        authenticated:
          type: boolean
        role:
          type: string
          description: Vai trò được hệ thống xác định sau khi xác thực.
      required:
        - authenticated

    Profile:
      type: object
      description: Hồ sơ người dùng; các trường chi tiết chưa được README xác định.
      additionalProperties: true

    ProfileUpdateRequest:
      type: object
      description: Các thông tin cá nhân cần cập nhật; trường cụ thể chưa được README xác định.
      additionalProperties: true

    DriverProfile:
      type: object
      description: Hồ sơ tài xế và dữ liệu phương tiện; trường cụ thể chưa được README xác định.
      additionalProperties: true

    DriverProfileUpdateRequest:
      type: object
      description: Dữ liệu hồ sơ/phương tiện tài xế cần thay đổi.
      additionalProperties: true

    DriverStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - ONLINE
            - OFFLINE
          description: Trạng thái tài xế chủ động lựa chọn.
      required:
        - status

    DriverStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ONLINE
            - OFFLINE
            - BUSY
      required:
        - status

    BookingRequest:
      type: object
      properties:
        pickupLocation:
          $ref: '#/components/schemas/LocationInput'
        destination:
          $ref: '#/components/schemas/LocationInput'
        vehicleType:
          type: string
          description: Loại xe khách hàng mong muốn; danh sách loại xe chưa được README chốt.
      required:
        - pickupLocation
        - destination
        - vehicleType

    Booking:
      type: object
      properties:
        bookingId:
          type: string
        pickupLocation:
          $ref: '#/components/schemas/LocationInput'
        destination:
          $ref: '#/components/schemas/LocationInput'
        vehicleType:
          type: string
        status:
          type: string
          description: Trạng thái yêu cầu đặt xe; bộ giá trị chi tiết chưa được README chốt.
      required:
        - bookingId
        - pickupLocation
        - destination
        - vehicleType

    TripAssignment:
      type: object
      properties:
        tripId:
          type: string
        driverId:
          type: string
        status:
          type: string
          description: Trạng thái chuyến sau khi phân công.
      required:
        - tripId
        - driverId

    TripStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - ARRIVED_AT_PICKUP
            - PICKED_UP
            - IN_PROGRESS
            - COMPLETED
      required:
        - status

    Trip:
      type: object
      properties:
        tripId:
          type: string
        driverId:
          type: string
          nullable: true
        status:
          type: string
          description: Trạng thái hiện tại của chuyến.
      required:
        - tripId
        - status

    LocationInput:
      type: object
      description: |
        Điểm đón hoặc điểm đến. README yêu cầu địa điểm nhưng chưa quy định
        phải truyền địa chỉ chữ, tọa độ hay mã bản đồ cụ thể.
      additionalProperties: true

    Location:
      type: object
      description: |
        Dữ liệu vị trí GPS. latitude/longitude là biểu diễn kỹ thuật
        tối thiểu để mô tả dữ liệu vị trí trong API.
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
        - latitude
        - longitude

    TripTracking:
      type: object
      properties:
        tripId:
          type: string
        status:
          type: string
        driverLocation:
          allOf:
            - $ref: '#/components/schemas/Location'
          nullable: true
        driverInfo:
          type: object
          description: Thông tin tài xế được hiển thị cho khách; trường cụ thể chưa được README xác định.
          additionalProperties: true
        estimatedTime:
          type: string
          nullable: true
          description: Thời gian dự kiến nếu dữ liệu đáp ứng điều kiện.
      required:
        - tripId
        - status

    Fare:
      type: object
      properties:
        tripId:
          type: string
        amount:
          type: number
          format: double
          description: Tổng số tiền của chuyến.
        currency:
          type: string
          description: Đơn vị tiền tệ; README chưa quy định giá trị cụ thể.
      required:
        - tripId
        - amount

    PaymentRequest:
      type: object
      properties:
        paymentMethod:
          type: string
          enum:
            - CASH
            - ELECTRONIC
        paymentToken:
          type: string
          nullable: true
          description: |
            Token/mã định danh dùng cho thanh toán điện tử nếu nhà cung cấp yêu cầu.
            Không truyền PAN/số thẻ, CVV/CVC, OTP hoặc mật khẩu thanh toán.
      required:
        - paymentMethod

    Payment:
      type: object
      properties:
        transactionId:
          type: string
        tripId:
          type: string
        paymentMethod:
          type: string
          enum:
            - CASH
            - ELECTRONIC
        status:
          type: string
          description: Kết quả giao dịch; bộ trạng thái chi tiết chưa được README chốt.
      required:
        - transactionId
        - tripId
        - paymentMethod
        - status

    TripHistoryItem:
      type: object
      properties:
        tripId:
          type: string
        status:
          type: string
        amount:
          type: number
          format: double
      required:
        - tripId

    TripHistoryDetail:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        amount:
          type: number
          format: double
      required:
        - trip
        - amount

    RatingRequest:
      type: object
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: string
          description: Phản hồi của khách hàng về chất lượng dịch vụ.
      required:
        - stars

    Rating:
      type: object
      properties:
        tripId:
          type: string
        stars:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: string
      required:
        - tripId
        - stars

    Customer:
      type: object
      description: Dữ liệu khách hàng; README chưa quy định cấu trúc trường chi tiết.
      additionalProperties: true

    Driver:
      type: object
      description: Dữ liệu tài xế; README chưa quy định cấu trúc trường chi tiết.
      properties:
        driverId:
          type: string
        status:
          type: string
