openapi: 3.0.0
info:
  title: CAB System API - Nghiệp vụ Tài khoản và hồ sơ
  version: 1.0.0
  description: Tài liệu API riêng cho nghiệp vụ tài khoản và hồ sơ, được tách từ file OpenAPI tổng của hệ thống CAB và bám
    theo README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Account
  description: UC01 - Quản lý tài khoản và hồ sơ
paths:
  /auth/register:
    post:
      tags:
      - Account
      summary: Đăng ký tài khoản khách hàng
      description: 'Ánh xạ FR-01 và UC01.

        README chỉ yêu cầu khách hàng có thể tạo tài khoản mới,

        nhưng chưa quy định cụ thể các trường đăng ký.

        '
      operationId: registerCustomer
      requestBody:
        required: true
        description: Thông tin đăng ký theo chính sách tài khoản của doanh nghiệp.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResult'
        '400':
          description: Dữ liệu đăng ký thiếu hoặc không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
      - Account
      summary: Đăng nhập hệ thống
      description: 'Ánh xạ FR-02, FR-54 và UC01/UC11.

        README yêu cầu xác thực người dùng nhưng không quy định JWT,

        session hay loại token cụ thể.

        '
      operationId: login
      requestBody:
        required: true
        description: Thông tin xác thực. Các trường cụ thể chưa được README xác định.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: Thiếu dữ liệu đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thông tin xác thực không chính xác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/profile:
    get:
      tags:
      - Account
      summary: Xem hồ sơ hiện tại
      description: 'Ánh xạ UC01. Use Case mô tả người dùng mở chức năng hồ sơ

        và hệ thống hiển thị thông tin hiện tại.

        '
      operationId: getMyProfile
      responses:
        '200':
          description: Trả về hồ sơ hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Người dùng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Account
      summary: Cập nhật hồ sơ cá nhân
      description: Ánh xạ FR-03 và UC01.
      operationId: updateMyProfile
      requestBody:
        required: true
        description: Dữ liệu hồ sơ cần thay đổi. README chưa quy định danh sách trường cụ thể.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Dữ liệu hồ sơ không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Người dùng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/me/profile:
    put:
      tags:
      - Account
      summary: Cập nhật hồ sơ và dữ liệu phương tiện của tài xế
      description: 'Ánh xạ FR-05 và UC01.

        README cho phép tài xế bổ sung/thay đổi hồ sơ và dữ liệu phương tiện,

        nhưng chưa quy định chi tiết các trường.

        '
      operationId: updateDriverProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          description: Dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền của tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/me/status:
    put:
      tags:
      - Account
      summary: Cập nhật trạng thái hoạt động của tài xế
      description: 'Ánh xạ FR-06 và BR-R02.

        Tài xế có thể chuyển trạng thái hoạt động; khi đã nhận chuyến,

        hệ thống có thể tự chuyển tài xế sang trạng thái Busy.

        '
      operationId: updateDriverWorkingStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Trạng thái được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverStatus'
        '400':
          description: Trạng thái không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền của tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    RegisterRequest:
      type: object
      description: 'Thông tin tạo tài khoản. README chưa quy định tên các trường

        như username/email/số điện thoại nên không tự thêm trường cụ thể.

        '
      additionalProperties: true
    AccountResult:
      type: object
      properties:
        accountId:
          type: string
          description: Mã tài khoản do hệ thống tạo.
        message:
          type: string
      required:
      - accountId
    LoginRequest:
      type: object
      description: 'Thông tin xác thực. README chưa quy định tên đăng nhập,

        mật khẩu, OTP hay cơ chế xác thực cụ thể.

        '
      additionalProperties: true
    LoginResult:
      type: object
      description: 'Kết quả xác thực. README chưa quy định loại token/session,

        vì vậy không tự khai báo accessToken hoặc JWT.

        '
      properties:
        authenticated:
          type: boolean
        role:
          type: string
          description: Vai trò được hệ thống xác định sau khi xác thực.
      required:
      - authenticated
    Profile:
      type: object
      description: Hồ sơ người dùng; các trường chi tiết chưa được README xác định.
      additionalProperties: true
    ProfileUpdateRequest:
      type: object
      description: Các thông tin cá nhân cần cập nhật; trường cụ thể chưa được README xác định.
      additionalProperties: true
    DriverProfile:
      type: object
      description: Hồ sơ tài xế và dữ liệu phương tiện; trường cụ thể chưa được README xác định.
      additionalProperties: true
    DriverProfileUpdateRequest:
      type: object
      description: Dữ liệu hồ sơ/phương tiện tài xế cần thay đổi.
      additionalProperties: true
    DriverStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          description: Trạng thái tài xế chủ động lựa chọn.
      required:
      - status
    DriverStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - BUSY
      required:
      - status
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
