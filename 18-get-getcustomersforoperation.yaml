openapi: 3.0.0
info:
  title: CAB System API - Tra cứu và quản lý thông tin khách hàng
  version: 1.0.0
  description: Tài liệu OpenAPI riêng cho API GET /admin/customers. Nội dung được tách nguyên từ tài liệu CAB System API dựa
    trên README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Operation
  description: UC09 - Quản lý vận hành
paths:
  /admin/customers:
    get:
      tags:
      - Operation
      summary: Tra cứu và quản lý thông tin khách hàng
      description: 'Ánh xạ FR-42 và UC09.

        README chưa quy định các điều kiện lọc cụ thể nên API chỉ mô tả thao tác tra cứu.

        '
      operationId: getCustomersForOperation
      responses:
        '200':
          description: Danh sách/thông tin khách hàng theo quyền của nhân viên.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Customer:
      type: object
      description: Dữ liệu khách hàng; README chưa quy định cấu trúc trường chi tiết.
      additionalProperties: true
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
