openapi: 3.0.0
info:
  title: CAB System API - Ghi nhận hoặc thực hiện thanh toán chuyến
  version: 1.0.0
  description: Tài liệu OpenAPI riêng cho API POST /trips/{tripId}/payments. Nội dung được tách nguyên từ tài liệu CAB System
    API dựa trên README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Payment
  description: UC06 - Tính cước và thanh toán
paths:
  /trips/{tripId}/payments:
    post:
      tags:
      - Payment
      summary: Ghi nhận hoặc thực hiện thanh toán chuyến
      description: 'Ánh xạ FR-29 đến FR-32, UC06, BR-R07 và BR-R08.

        Hỗ trợ tiền mặt hoặc thanh toán điện tử.

        CAB không lưu trực tiếp PAN/số thẻ, CVV/CVC, OTP hoặc mật khẩu thanh toán.

        '
      operationId: createTripPayment
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã chuyến đi.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Kết quả giao dịch được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Phương thức hoặc dữ liệu thanh toán không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Người dùng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Nhà cung cấp thanh toán điện tử không phản hồi hoặc xử lý thất bại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống CAB không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PaymentRequest:
      type: object
      properties:
        paymentMethod:
          type: string
          enum:
          - CASH
          - ELECTRONIC
        paymentToken:
          type: string
          nullable: true
          description: 'Token/mã định danh dùng cho thanh toán điện tử nếu nhà cung cấp yêu cầu.

            Không truyền PAN/số thẻ, CVV/CVC, OTP hoặc mật khẩu thanh toán.

            '
      required:
      - paymentMethod
    Payment:
      type: object
      properties:
        transactionId:
          type: string
        tripId:
          type: string
        paymentMethod:
          type: string
          enum:
          - CASH
          - ELECTRONIC
        status:
          type: string
          description: Kết quả giao dịch; bộ trạng thái chi tiết chưa được README chốt.
      required:
      - transactionId
      - tripId
      - paymentMethod
      - status
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
