openapi: 3.0.0
info:
  title: CAB System API - Nghiệp vụ Quản lý và theo dõi chuyến đi
  version: 1.0.0
  description: Tài liệu API riêng cho nghiệp vụ quản lý và theo dõi chuyến đi, được tách từ file OpenAPI tổng của hệ thống
    CAB và bám theo README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Trip
  description: UC04, UC05 - Quản lý và theo dõi chuyến đi
paths:
  /trips/{tripId}/status:
    put:
      tags:
      - Trip
      summary: Tài xế cập nhật trạng thái chuyến
      description: 'Ánh xạ FR-21 đến FR-24 và UC04.

        Các giai đoạn được README nêu gồm: tới điểm đón, đã đón khách,

        đang thực hiện chuyến và hoàn tất.

        '
      operationId: updateTripStatus
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã chuyến đi.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Trạng thái chuyến được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Trạng thái hoặc dữ liệu cập nhật không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tài xế không được phân công cho chuyến này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drivers/me/location:
    put:
      tags:
      - Trip
      summary: Cập nhật vị trí tài xế
      description: 'Ánh xạ FR-25 và quy trình thực hiện chuyến.

        README yêu cầu ứng dụng tài xế gửi dữ liệu GPS định kỳ trong chuyến.

        '
      operationId: updateDriverLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Vị trí được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Dữ liệu vị trí không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Tài xế chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{tripId}/tracking:
    get:
      tags:
      - Trip
      summary: Theo dõi chuyến đi
      description: 'Ánh xạ FR-26 và UC05.

        Hệ thống trả về trạng thái hiện tại, vị trí tài xế khi có dữ liệu,

        thông tin tài xế và thời gian dự kiến nếu dữ liệu đáp ứng điều kiện.

        '
      operationId: getTripTracking
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã chuyến đi.
        schema:
          type: string
      responses:
        '200':
          description: Thông tin theo dõi chuyến hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripTracking'
        '401':
          description: Khách hàng chưa được xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền xem chuyến này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    TripStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ARRIVED_AT_PICKUP
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
      required:
      - status
    Trip:
      type: object
      properties:
        tripId:
          type: string
        driverId:
          type: string
          nullable: true
        status:
          type: string
          description: Trạng thái hiện tại của chuyến.
      required:
      - tripId
      - status
    Location:
      type: object
      description: 'Dữ liệu vị trí GPS. latitude/longitude là biểu diễn kỹ thuật

        tối thiểu để mô tả dữ liệu vị trí trong API.

        '
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - latitude
      - longitude
    TripTracking:
      type: object
      properties:
        tripId:
          type: string
        status:
          type: string
        driverLocation:
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        driverInfo:
          type: object
          description: Thông tin tài xế được hiển thị cho khách; trường cụ thể chưa được README xác định.
          additionalProperties: true
        estimatedTime:
          type: string
          nullable: true
          description: Thời gian dự kiến nếu dữ liệu đáp ứng điều kiện.
      required:
      - tripId
      - status
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
