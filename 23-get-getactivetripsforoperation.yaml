openapi: 3.0.0
info:
  title: CAB System API - Xem các chuyến đang hoạt động
  version: 1.0.0
  description: Tài liệu OpenAPI riêng cho API GET /admin/trips. Nội dung được tách nguyên từ tài liệu CAB System API dựa trên
    README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Operation
  description: UC09 - Quản lý vận hành
paths:
  /admin/trips:
    get:
      tags:
      - Operation
      summary: Xem các chuyến đang hoạt động
      description: Ánh xạ FR-45 và UC09.
      operationId: getActiveTripsForOperation
      responses:
        '200':
          description: Danh sách chuyến đang được thực hiện.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Trip:
      type: object
      properties:
        tripId:
          type: string
        driverId:
          type: string
          nullable: true
        status:
          type: string
          description: Trạng thái hiện tại của chuyến.
      required:
      - tripId
      - status
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
