openapi: 3.0.0
info:
  title: CAB System API - Nghiệp vụ Giao dịch và báo cáo
  version: 1.0.0
  description: Tài liệu API riêng cho nghiệp vụ giao dịch và báo cáo, được tách từ file OpenAPI tổng của hệ thống CAB và bám
    theo README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Report
  description: UC10 - Quản lý giao dịch và báo cáo
paths:
  /admin/transactions:
    get:
      tags:
      - Report
      summary: Tra cứu lịch sử giao dịch
      description: 'Ánh xạ FR-48, FR-49 và UC10.

        README có yêu cầu tìm kiếm giao dịch nhưng chưa xác định các bộ lọc cụ thể.

        '
      operationId: getTransactions
      responses:
        '200':
          description: Danh sách giao dịch.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Người dùng chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền xem giao dịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/reports/overview:
    get:
      tags:
      - Report
      summary: Xem báo cáo tổng quan
      description: 'Ánh xạ FR-50 đến FR-53 và UC10.

        Báo cáo gồm số lượng chuyến, doanh thu, tỷ lệ hoàn thành,

        tỷ lệ hủy và thông tin phục vụ đánh giá hiệu quả tài xế.

        '
      operationId: getOverviewReport
      responses:
        '200':
          description: Báo cáo tổng quan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewReport'
        '401':
          description: Người dùng chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Người dùng không có quyền xem báo cáo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Transaction:
      type: object
      properties:
        transactionId:
          type: string
        tripId:
          type: string
        status:
          type: string
      additionalProperties: true
    OverviewReport:
      type: object
      properties:
        tripCount:
          type: integer
          description: Số lượng chuyến.
        revenue:
          type: number
          format: double
          description: Doanh thu.
        completionRate:
          type: number
          format: double
          description: Tỷ lệ hoàn thành.
        cancellationRate:
          type: number
          format: double
          description: Tỷ lệ hủy.
        driverPerformance:
          type: object
          description: 'Số liệu phục vụ đánh giá hiệu quả hoạt động tài xế.

            README chưa quy định công thức/chỉ số con cụ thể.

            '
          additionalProperties: true
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
