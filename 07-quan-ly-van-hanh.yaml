openapi: 3.0.0
info:
  title: CAB System API - Nghiệp vụ Quản lý vận hành
  version: 1.0.0
  description: Tài liệu API riêng cho nghiệp vụ quản lý vận hành, được tách từ file OpenAPI tổng của hệ thống CAB và bám theo
    README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Operation
  description: UC09 - Quản lý vận hành
paths:
  /admin/customers:
    get:
      tags:
      - Operation
      summary: Tra cứu và quản lý thông tin khách hàng
      description: 'Ánh xạ FR-42 và UC09.

        README chưa quy định các điều kiện lọc cụ thể nên API chỉ mô tả thao tác tra cứu.

        '
      operationId: getCustomersForOperation
      responses:
        '200':
          description: Danh sách/thông tin khách hàng theo quyền của nhân viên.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/drivers:
    get:
      tags:
      - Operation
      summary: Tra cứu và quản lý dữ liệu tài xế
      description: Ánh xạ FR-43, FR-46 và UC09.
      operationId: getDriversForOperation
      responses:
        '200':
          description: Danh sách tài xế và trạng thái hoạt động.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/drivers/{driverId}:
    put:
      tags:
      - Operation
      summary: Cập nhật dữ liệu tài xế
      description: 'Ánh xạ FR-43 và UC09.

        README chưa quy định cụ thể các trường nhân viên vận hành được phép thay đổi.

        '
      operationId: updateDriverByOperation
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã tài xế.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationUpdateRequest'
      responses:
        '200':
          description: Dữ liệu tài xế được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Dữ liệu cập nhật không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/vehicles:
    get:
      tags:
      - Operation
      summary: Tra cứu thông tin phương tiện
      description: Ánh xạ FR-44 và UC09.
      operationId: getVehiclesForOperation
      responses:
        '200':
          description: Danh sách phương tiện.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/vehicles/{vehicleId}:
    put:
      tags:
      - Operation
      summary: Cập nhật thông tin phương tiện
      description: 'Ánh xạ FR-44 và UC09.

        README chưa quy định chi tiết các trường phương tiện được cập nhật.

        '
      operationId: updateVehicleByOperation
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã phương tiện.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationUpdateRequest'
      responses:
        '200':
          description: Thông tin phương tiện được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          description: Dữ liệu cập nhật không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy phương tiện.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/trips:
    get:
      tags:
      - Operation
      summary: Xem các chuyến đang hoạt động
      description: Ánh xạ FR-45 và UC09.
      operationId: getActiveTripsForOperation
      responses:
        '200':
          description: Danh sách chuyến đang được thực hiện.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/trips/{tripId}/issues:
    post:
      tags:
      - Operation
      summary: Ghi nhận xử lý trường hợp chuyến gặp vấn đề
      description: 'Ánh xạ FR-47 và UC09.

        README yêu cầu nhân viên vận hành ghi nhận và xử lý trường hợp bất thường,

        nhưng chưa quy định cấu trúc dữ liệu chi tiết.

        '
      operationId: recordTripIssueHandling
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã chuyến đi.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripIssueRequest'
      responses:
        '201':
          description: Kết quả xử lý được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripIssue'
        '400':
          description: Dữ liệu ghi nhận không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Trip:
      type: object
      properties:
        tripId:
          type: string
        driverId:
          type: string
          nullable: true
        status:
          type: string
          description: Trạng thái hiện tại của chuyến.
      required:
      - tripId
      - status
    Customer:
      type: object
      description: Dữ liệu khách hàng; README chưa quy định cấu trúc trường chi tiết.
      additionalProperties: true
    Driver:
      type: object
      description: Dữ liệu tài xế; README chưa quy định cấu trúc trường chi tiết.
      properties:
        driverId:
          type: string
        status:
          type: string
      additionalProperties: true
    Vehicle:
      type: object
      description: Dữ liệu phương tiện; README chưa quy định cấu trúc trường chi tiết.
      properties:
        vehicleId:
          type: string
      additionalProperties: true
    OperationUpdateRequest:
      type: object
      description: Dữ liệu cập nhật của nhân viên vận hành; README chưa quy định trường cụ thể.
      additionalProperties: true
    TripIssueRequest:
      type: object
      description: 'Nội dung ghi nhận/xử lý trường hợp bất thường của chuyến.

        README chưa quy định các trường chi tiết.

        '
      additionalProperties: true
    TripIssue:
      type: object
      properties:
        tripId:
          type: string
        issueId:
          type: string
      additionalProperties: true
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
