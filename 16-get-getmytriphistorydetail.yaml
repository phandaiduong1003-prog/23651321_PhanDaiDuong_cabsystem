openapi: 3.0.0
info:
  title: CAB System API - Xem chi tiết một chuyến trong lịch sử
  version: 1.0.0
  description: Tài liệu OpenAPI riêng cho API GET /customers/me/trips/{tripId}. Nội dung được tách nguyên từ tài liệu CAB
    System API dựa trên README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: HistoryRating
  description: UC08 - Lịch sử và đánh giá chuyến
paths:
  /customers/me/trips/{tripId}:
    get:
      tags:
      - HistoryRating
      summary: Xem chi tiết một chuyến trong lịch sử
      description: 'Ánh xạ FR-40 và UC08.

        Hệ thống hiển thị chi tiết chuyến và số tiền tương ứng.

        '
      operationId: getMyTripHistoryDetail
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã chuyến đi.
        schema:
          type: string
      responses:
        '200':
          description: Chi tiết chuyến và số tiền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripHistoryDetail'
        '401':
          description: Khách hàng chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Chuyến không thuộc khách hàng hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy chuyến.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Trip:
      type: object
      properties:
        tripId:
          type: string
        driverId:
          type: string
          nullable: true
        status:
          type: string
          description: Trạng thái hiện tại của chuyến.
      required:
      - tripId
      - status
    TripHistoryDetail:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        amount:
          type: number
          format: double
      required:
      - trip
      - amount
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
