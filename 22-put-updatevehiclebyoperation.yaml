openapi: 3.0.0
info:
  title: CAB System API - Cập nhật thông tin phương tiện
  version: 1.0.0
  description: Tài liệu OpenAPI riêng cho API PUT /admin/vehicles/{vehicleId}. Nội dung được tách nguyên từ tài liệu CAB System
    API dựa trên README dự án.
servers:
- url: /api/v1
  description: Base path đề xuất. README chưa quy định host/port triển khai thực tế.
tags:
- name: Operation
  description: UC09 - Quản lý vận hành
paths:
  /admin/vehicles/{vehicleId}:
    put:
      tags:
      - Operation
      summary: Cập nhật thông tin phương tiện
      description: 'Ánh xạ FR-44 và UC09.

        README chưa quy định chi tiết các trường phương tiện được cập nhật.

        '
      operationId: updateVehicleByOperation
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã phương tiện.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationUpdateRequest'
      responses:
        '200':
          description: Thông tin phương tiện được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          description: Dữ liệu cập nhật không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nhân viên chưa đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Nhân viên không đủ quyền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy phương tiện.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Hệ thống không thể xử lý yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Vehicle:
      type: object
      description: Dữ liệu phương tiện; README chưa quy định cấu trúc trường chi tiết.
      properties:
        vehicleId:
          type: string
      additionalProperties: true
    OperationUpdateRequest:
      type: object
      description: Dữ liệu cập nhật của nhân viên vận hành; README chưa quy định trường cụ thể.
      additionalProperties: true
    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Mã lỗi kỹ thuật/nghiệp vụ.
        message:
          type: string
          description: Nội dung mô tả lỗi.
      required:
      - error_code
      - message
